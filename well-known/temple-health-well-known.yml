findings:
  - >-
    No security.txt on any host. Temple Health publishes no RFC 9116 contact, so
    no SecurityTxt pointer is emitted and no vulnerability-disclosure artifact
    was written.
  - >-
    No A2A agent card on any host, at either the canonical or the legacy path.
    Per the pipeline's search-only rule, nothing was authored in a2a/.
  - >-
    The only agent-reachable discovery documents are the SMART/OIDC pair on the
    FHIR host and the CMS price-transparency index on the website. Both exist
    because a standard or a regulator requires them, not because Temple Health
    runs a developer program.
