privacy:
  classification: PHI
  note: >-
    Every resource in this graph except the terminology resources (ValueSet,
    ConceptMap) and Medication returns protected health information about a real
    patient once a token is presented. No example in this repo may contain a live
    response body. Structural documentation is the deliverable; the specific human
    is not.
