generated: '2026-08-15'
method: derived
source: >-
  Derived from the live R4 CapabilityStatement fetched 2026-08-15 from
  https://epicaccess.templehealth.org/FhirProxyPrd/api/FHIR/R4/metadata — every
  relationship below is a searchParam of type "reference" that the server itself
  declares — plus the schemas in openapi/*.yml.
description: >-
  The entity graph an agent actually gets from this endpoint. The refined
  OpenAPIs in openapi/ cover seven resources; the live server declares 59. This
  file records the full graph as the server states it, because the reference-type
  search parameters ARE the relationship map: each one is a traversable edge the
  server will resolve.

root: Patient
identity:
  scheme: FHIR logical id (opaque server-assigned string)
  path_form: '{base}/{ResourceType}/{id}'
  note: >-
    Epic logical ids are opaque and instance-specific; they are not stable across
    FHIR versions (an R4 id is not a DSTU2 id) and must never be constructed. IDs
    identify real patients — treat every id observed in a response as PHI.

traversal:
  include: '_include supported on every resource (searchInclude ["*"])'
  rev_include: '_revinclude limited to Provenance:target on every resource'
  note: >-
    The only reverse edge the server will follow is Provenance — an agent cannot
    ask "what points at this Patient?" for anything else, it must search each
    resource type by patient=.

entities:
  - name: Patient
    interactions: [create, read, search-type]
    profile: us-core-patient|6.1.0
    search_params: 30
    note: The compartment root. Every clinical query is scoped by patient=.
  - name: Encounter
    interactions: [read, search-type]
    search_params: 32
  - name: Observation
    interactions: [create, read, search-type, update]
    profiles: 22 us-core Observation profiles (vitals, labs, smoking status, SDOH screening)
    search_params: 30
  - name: Condition
    interactions: [create, read, search-type, update]
  - name: AllergyIntolerance
    interactions: [create, read, search-type, update]
  - name: MedicationRequest
    interactions: [read, search-type]
  - name: DocumentReference
    interactions: [create, read, search-type, update]
    search_params: 27
    note: Gateway to Binary — attachment content is fetched from Binary, not inline.
  - name: Binary
    interactions: [read, search-type]
    note: Raw document/attachment bytes (CCDA, PDF, images). No search params.
  - name: Group
    interactions: [read, search-type]
    operations: [group-export]
    note: The Bulk Data export root. $export runs against a Group, not a Patient.
  - name: Provenance
    interactions: [read, search-type]
    note: The only _revinclude target; carries the audit lineage for any resource.
  - name: Coverage
    interactions: [read, search-type]
  - name: ExplanationOfBenefit
    interactions: [read, search-type]
    note: Claims/financial arm of the graph; hangs off Patient + Coverage + Claim.

