apis:
  - aid: temple-health:temple-health-fhir-dstu2-api
    name: Temple Health FHIR DSTU2 API
    tags:
      - DSTU2
      - Epic
      - FHIR
      - Legacy
      - SMART on FHIR
    humanURL: https://epicaccess.templehealth.org/FhirProxyPrd/api/FHIR/DSTU2/
    baseURL: https://epicaccess.templehealth.org/FhirProxyPrd/api/FHIR/DSTU2
    description: >-
      The legacy Temple Health DSTU2 FHIR endpoint listed in Epic's public DSTU2 endpoint registry under
      the organization "TempleHealth". It remains available for backward compatibility with older SMART
      on FHIR apps written against the FHIR DSTU2 (1.0.2) baseline that pre-dates the CMS Interoperability
      and Patient Access mandate; new integrations should target the R4 endpoint instead. Supported resources
      include AllergyIntolerance, Binary, CarePlan, Condition, Device, DiagnosticReport, DocumentReference,
      FamilyMemberHistory, Goal, Immunization, Medication, MedicationOrder, MedicationStatement, Observation,
      Patient, Practitioner, and Procedure.
    properties:
      - type: CapabilityStatement
        url: https://epicaccess.templehealth.org/FhirProxyPrd/api/FHIR/DSTU2/metadata
      - type: Authorization
        url: https://epicaccess.templehealth.org/FhirProxyPrd/oauth2/authorize
      - type: Token
        url: https://epicaccess.templehealth.org/FhirProxyPrd/oauth2/token
      - type: Documentation
        url: https://fhir.epic.com/Specifications
      - type: EndpointDirectory
        url: https://open.epic.com/Endpoints/DSTU2
